<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>과제 및 자료 제출 포털</title>
  
  <!-- React 및 ReactDOM 로드 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- 브라우저에서 JSX를 변환하기 위한 Babel 로드 -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS 로드 -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- 여기서부터 실제 앱 코드입니다 -->
  <script type="text/babel">
    const { useState, useCallback, useRef } = React;

    // --- 아이콘 컴포넌트 정의 ---
    const Icon = ({ className, children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );

    const FileUpIcon = ({ className }) => <Icon className={className}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 12v6"/><path d="m15 15-3-3-3 3"/></Icon>;
    const UploadCloudIcon = ({ className }) => <Icon className={className}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></Icon>;
    const FileTextIcon = ({ className }) => <Icon className={className}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></Icon>;
    const XIcon = ({ className }) => <Icon className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;
    const CheckCircleIcon = ({ className }) => <Icon className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></Icon>;
    const AlertCircleIcon = ({ className }) => <Icon className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></Icon>;
    const InfoIcon = ({ className }) => <Icon className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></Icon>;
    const FilmIcon = ({ className }) => <Icon className={className}><rect width="20" height="20" x="2" y="2" rx="2.18" ry="2.18"/><line x1="7" x2="7" y1="2" y2="22"/><line x1="17" x2="17" y1="2" y2="22"/><line x1="2" x2="22" y1="12" y2="12"/><line x1="2" x2="7" y1="7" y2="7"/><line x1="2" x2="7" y1="17" y2="17"/><line x1="17" x2="22" y1="17" y2="17"/><line x1="17" x2="22" y1="7" y2="7"/></Icon>;
    const Loader2Icon = ({ className }) => <Icon className={className}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></Icon>;
    const MessageCircleIcon = ({ className }) => <Icon className={className}><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></Icon>;
    const ExternalLinkIcon = ({ className }) => <Icon className={className}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></Icon>;
    const SmartphoneIcon = ({ className }) => <Icon className={className}><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></Icon>;
    // ----------------------------

    function App() {
      const [files, setFiles] = useState([]);
      const [uploaderName, setUploaderName] = useState('');
      const [grade, setGrade] = useState('');
      const [classNum, setClassNum] = useState('');
      const [studentNum, setStudentNum] = useState('');
      const [isDragging, setIsDragging] = useState(false);
      const [uploadState, setUploadState] = useState('idle');
      const [progress, setProgress] = useState(0);
      const [showGuide, setShowGuide] = useState(false);
      const [showVideoGuide, setShowVideoGuide] = useState(false);
      const [fileError, setFileError] = useState('');
      const [hasLargeVideo, setHasLargeVideo] = useState(false);
      const fileInputRef = useRef(null);

      // 알려주신 Apps Script URL 적용
      const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyZhSauF5rwluz5PFT3afucPBXFUyqbyRYMzrJtILL_eVFT9W6WkJgtJ4qK1KmcfWI/exec"; 

      const handleDragEnter = useCallback((e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(true); }, []);
      const handleDragLeave = useCallback((e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(false); }, []);
      const handleDragOver = useCallback((e) => { e.preventDefault(); e.stopPropagation(); }, []);

      const handleDrop = useCallback((e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(false);
        setFileError('');
        setHasLargeVideo(false);
        
        const droppedFiles = Array.from(e.dataTransfer.files);
        const validFiles = droppedFiles.filter(file => file.size <= 50 * 1024 * 1024);
        const rejectedVideos = droppedFiles.filter(file => file.size > 50 * 1024 * 1024 && file.type.startsWith('video/'));
        
        if (validFiles.length < droppedFiles.length) setFileError('50MB를 초과하는 파일은 제외되었습니다. (구글 시스템 제한)');
        if (rejectedVideos.length > 0) setHasLargeVideo(true);
        if (validFiles.length > 0) setFiles((prev) => [...prev, ...validFiles]);
      }, []);

      const handleFileSelect = (e) => {
        setFileError('');
        setHasLargeVideo(false);
        
        const selectedFiles = Array.from(e.target.files);
        const validFiles = selectedFiles.filter(file => file.size <= 50 * 1024 * 1024);
        const rejectedVideos = selectedFiles.filter(file => file.size > 50 * 1024 * 1024 && file.type.startsWith('video/'));
        
        if (validFiles.length < selectedFiles.length) setFileError('50MB를 초과하는 파일은 제외되었습니다. (구글 시스템 제한)');
        if (rejectedVideos.length > 0) setHasLargeVideo(true);
        if (validFiles.length > 0) setFiles((prev) => [...prev, ...validFiles]);
      };

      const removeFile = (indexToRemove) => {
        setFiles((prev) => prev.filter((_, index) => index !== indexToRemove));
      };

      const formatFileSize = (bytes) => {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
      };

      const readFileAsBase64 = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const base64Data = reader.result.split(',')[1];
            resolve(base64Data);
          };
          reader.onerror = error => reject(error);
          reader.readAsDataURL(file);
        });
      };

      const handleSubmit = async () => {
        if (files.length === 0) return;
        
        setUploadState('uploading');
        setProgress(0);

        try {
          for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const base64Data = await readFileAsBase64(file);
            
            const prefixParts = [];
            if (grade) prefixParts.push(`${grade}학년`);
            if (classNum) prefixParts.push(`${classNum}반`);
            if (studentNum) prefixParts.push(`${studentNum}번`);
            if (uploaderName) prefixParts.push(uploaderName);
            const prefix = prefixParts.join(' ');
            
            const payload = {
              fileName: prefix ? `[${prefix}]_${file.name}` : file.name,
              mimeType: file.type || 'application/octet-stream',
              fileData: base64Data
            };

            const response = await fetch(WEB_APP_URL, {
              method: 'POST',
              body: JSON.stringify(payload),
              headers: {
                'Content-Type': 'text/plain;charset=utf-8',
              }
            });

            if (!response.ok) throw new Error('업로드 실패');
            setProgress(Math.round(((i + 1) / files.length) * 100));
          }
          
          setUploadState('success');
          setFiles([]);
          setUploaderName('');
          setGrade('');
          setClassNum('');
          setStudentNum('');
        } catch (error) {
          console.error(error);
          setUploadState('error');
        }
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col items-center py-12 px-4 sm:px-6 lg:px-8">
          
          <div className="max-w-2xl w-full text-center mb-8">
            <h1 className="text-3xl font-bold text-slate-900 tracking-tight flex items-center justify-center gap-2">
              <FileUpIcon className="w-8 h-8 text-blue-600" />
              과제 및 자료 제출 포털
            </h1>
            <p className="mt-3 text-slate-500">
              제출하신 파일은 관리자의 구글 드라이브로 안전하게 전송됩니다.
            </p>
          </div>

          <div className="max-w-2xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 flex flex-col relative z-10">
            <div className="p-8">
              
              <div className="mb-6 grid grid-cols-2 md:grid-cols-4 gap-4">
                <div>
                  <label htmlFor="grade" className="block text-sm font-medium text-slate-700 mb-1">학년</label>
                  <input type="number" id="grade" className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" placeholder="예: 1" value={grade} onChange={(e) => setGrade(e.target.value)} disabled={uploadState === 'uploading'} />
                </div>
                <div>
                  <label htmlFor="classNum" className="block text-sm font-medium text-slate-700 mb-1">반</label>
                  <input type="number" id="classNum" className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" placeholder="예: 3" value={classNum} onChange={(e) => setClassNum(e.target.value)} disabled={uploadState === 'uploading'} />
                </div>
                <div>
                  <label htmlFor="studentNum" className="block text-sm font-medium text-slate-700 mb-1">번호</label>
                  <input type="number" id="studentNum" className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" placeholder="예: 15" value={studentNum} onChange={(e) => setStudentNum(e.target.value)} disabled={uploadState === 'uploading'} />
                </div>
                <div>
                  <label htmlFor="uploaderName" className="block text-sm font-medium text-slate-700 mb-1">이름</label>
                  <input type="text" id="uploaderName" className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" placeholder="홍길동" value={uploaderName} onChange={(e) => setUploaderName(e.target.value)} disabled={uploadState === 'uploading'} />
                </div>
              </div>

              <div
                className={`relative border-2 border-dashed rounded-xl p-10 flex flex-col items-center justify-center transition-all duration-200 ease-in-out cursor-pointer
                  ${isDragging ? 'border-blue-500 bg-blue-50' : 'border-slate-300 hover:border-slate-400 bg-slate-50'}
                  ${uploadState === 'uploading' ? 'opacity-50 pointer-events-none' : ''}
                `}
                onDragEnter={handleDragEnter}
                onDragOver={handleDragOver}
                onDragLeave={handleDragLeave}
                onDrop={handleDrop}
                onClick={() => fileInputRef.current?.click()}
              >
                <input type="file" multiple ref={fileInputRef} onChange={handleFileSelect} className="hidden" />
                
                <div className={`p-4 rounded-full mb-4 ${isDragging ? 'bg-blue-100 text-blue-600' : 'bg-white text-slate-400 shadow-sm'}`}>
                  <UploadCloudIcon className="w-8 h-8" />
                </div>
                
                <p className="text-lg font-medium text-slate-700 text-center">
                  이곳으로 파일을 드래그하거나 <span className="text-blue-600 font-semibold">클릭하여 탐색</span>
                </p>
                <p className="text-sm text-slate-500 mt-2 text-center">
                  문서, 이미지, PDF 등 모든 파일 형식 지원 <span className="text-red-500 font-medium">(단일 파일 최대 50MB 제한)</span>
                </p>
              </div>
              
              <div className="mt-3 flex justify-center">
                <button 
                  onClick={() => setShowVideoGuide(true)}
                  className="text-xs text-slate-500 hover:text-blue-600 flex items-center gap-1.5 transition-colors font-medium bg-slate-100 hover:bg-blue-50 px-3 py-1.5 rounded-full"
                >
                  <FilmIcon className="w-3.5 h-3.5" />
                  동영상 용량이 50MB를 넘나요? 해결 방법 보기
                </button>
              </div>

              {fileError && (
                <div className="mt-4 p-3 bg-red-50 text-red-600 rounded-lg text-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3 border border-red-100">
                  <div className="flex items-center gap-2">
                    <AlertCircleIcon className="w-4 h-4 flex-shrink-0" />
                    {fileError}
                  </div>
                  {hasLargeVideo && (
                    <button
                      onClick={() => setShowVideoGuide(true)}
                      className="flex-shrink-0 bg-red-600 text-white px-3 py-1.5 rounded-md text-xs font-semibold hover:bg-red-700 transition-colors flex items-center justify-center gap-1.5 shadow-sm"
                    >
                      <FilmIcon className="w-3.5 h-3.5" />
                      동영상 용량 줄이기 도우미
                    </button>
                  )}
                </div>
              )}

              {files.length > 0 && (
                <div className="mt-8">
                  <h3 className="text-sm font-semibold text-slate-900 mb-3 flex justify-between items-center">
                    선택된 파일 ({files.length}개)
                    <span className="text-xs font-normal text-slate-500 bg-slate-100 px-2 py-1 rounded-full">
                      총 {formatFileSize(files.reduce((acc, file) => acc + file.size, 0))}
                    </span>
                  </h3>
                  <ul className="space-y-2 max-h-60 overflow-y-auto pr-2 custom-scrollbar">
                    {files.map((file, index) => (
                      <li key={`${file.name}-${index}`} className="flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-200">
                        <div className="flex items-center gap-3 overflow-hidden">
                          <FileTextIcon className="w-5 h-5 text-slate-400 flex-shrink-0" />
                          <div className="flex flex-col overflow-hidden">
                            <span className="text-sm font-medium text-slate-700 truncate">{file.name}</span>
                            <span className="text-xs text-slate-500">{formatFileSize(file.size)}</span>
                          </div>
                        </div>
                        {uploadState !== 'uploading' && (
                          <button onClick={() => removeFile(index)} className="p-1 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-md transition-colors" title="파일 삭제">
                            <XIcon className="w-4 h-4" />
                          </button>
                        )}
                      </li>
                    ))}
                  </ul>
                </div>
              )}

              {uploadState === 'success' && (
                <div className="mt-6 p-4 bg-green-50 text-green-700 rounded-lg flex items-start gap-3 border border-green-200">
                  <CheckCircleIcon className="w-5 h-5 flex-shrink-0 mt-0.5" />
                  <div>
                    <h4 className="font-medium">업로드 성공!</h4>
                    <p className="text-sm mt-1">파일이 구글 드라이브에 안전하게 저장되었습니다.</p>
                  </div>
                </div>
              )}

              {uploadState === 'error' && (
                <div className="mt-6 p-4 bg-red-50 text-red-700 rounded-lg flex items-start gap-3 border border-red-200">
                  <AlertCircleIcon className="w-5 h-5 flex-shrink-0 mt-0.5" />
                  <div>
                    <h4 className="font-medium">업로드 실패</h4>
                    <p className="text-sm mt-1">파일 전송 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</p>
                  </div>
                </div>
              )}

              {uploadState === 'uploading' && (
                <div className="mt-6">
                  <div className="flex justify-between text-sm text-slate-600 mb-1">
                    <span>업로드 중...</span>
                    <span>{progress}%</span>
                  </div>
                  <div className="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                    <div className="bg-blue-600 h-2 rounded-full transition-all duration-300 ease-out" style={{ width: `${progress}%` }}></div>
                  </div>
                </div>
              )}

              <div className="mt-8">
                <button
                  onClick={handleSubmit}
                  disabled={files.length === 0 || uploadState === 'uploading'}
                  className={`w-full py-3 px-4 rounded-xl font-semibold text-white flex items-center justify-center gap-2 transition-all
                    ${files.length === 0 || uploadState === 'uploading' ? 'bg-slate-300 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 hover:shadow-lg active:scale-[0.98]'}
                  `}
                >
                  {uploadState === 'uploading' ? (
                    <React.Fragment>
                      <Loader2Icon className="w-5 h-5 animate-spin" />
                      처리 중...
                    </React.Fragment>
                  ) : '파일 제출하기'}
                </button>
              </div>
            </div>
            
            <div className="bg-slate-50 px-8 py-4 border-t border-slate-100 flex justify-between items-center">
              <span className="text-xs text-slate-500">보안 전송 프로토콜 적용됨</span>
              <button onClick={() => setShowGuide(true)} className="text-xs font-medium text-blue-600 flex items-center gap-1 hover:underline">
                <InfoIcon className="w-4 h-4" />
                구글 드라이브 연동 방법
              </button>
            </div>
          </div>

          {/* 가이드 모달 */}
          {showGuide && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col">
                <div className="p-6 border-b border-slate-100 flex justify-between items-center sticky top-0 bg-white rounded-t-2xl">
                  <h2 className="text-xl font-bold text-slate-900">구글 드라이브 연동 가이드</h2>
                  <button onClick={() => setShowGuide(false)} className="p-2 hover:bg-slate-100 rounded-full text-slate-500">
                    <XIcon className="w-5 h-5" />
                  </button>
                </div>
                <div className="p-6 overflow-y-auto custom-scrollbar flex-1 text-sm text-slate-700 space-y-4">
                  <p>현재 연동이 완료되어 정상 작동 중입니다! 필요한 경우 코드를 수정하여 다른 드라이브로 연결할 수 있습니다.</p>
                </div>
                <div className="p-6 border-t border-slate-100 bg-slate-50 rounded-b-2xl">
                  <button onClick={() => setShowGuide(false)} className="w-full py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-900 transition-colors font-medium">닫기</button>
                </div>
              </div>
            </div>
          )}

          {showVideoGuide && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col">
                <div className="p-6 border-b border-slate-100 flex justify-between items-center sticky top-0 bg-white rounded-t-2xl">
                  <h2 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <FilmIcon className="w-6 h-6 text-blue-600" />
                    동영상 파일 50MB 이하로 줄이는 꿀팁
                  </h2>
                  <button onClick={() => setShowVideoGuide(false)} className="p-2 hover:bg-slate-100 rounded-full text-slate-500">
                    <XIcon className="w-5 h-5" />
                  </button>
                </div>
                <div className="p-6 overflow-y-auto custom-scrollbar flex-1 space-y-6">
                  <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-5">
                    <div className="flex items-center gap-3 mb-3">
                      <div className="bg-yellow-400 p-2 rounded-full text-yellow-900">
                        <MessageCircleIcon className="w-5 h-5" />
                      </div>
                      <h3 className="font-bold text-yellow-900 text-lg">방법 1. 카카오톡 '나에게 보내기' 활용 (가장 쉬움)</h3>
                    </div>
                    <p className="text-sm text-yellow-800 mb-3 leading-relaxed">스마트폰에서 동영상을 카카오톡으로 보내면 자동으로 용량이 크게 압축됩니다.</p>
                    <ol className="text-sm text-yellow-800 list-decimal list-inside space-y-1 ml-1 font-medium">
                      <li>카카오톡 <strong>'내 채팅방(나에게 보내기)'</strong> 열기</li>
                      <li>용량이 큰 동영상을 선택하여 전송 (화질 설정: 일반 화질)</li>
                      <li>전송된 동영상을 <strong>다시 휴대폰이나 PC에 저장</strong>하기</li>
                      <li>저장된 압축 파일을 이곳에 업로드!</li>
                    </ol>
                  </div>
                  <div className="bg-blue-50 border border-blue-100 rounded-xl p-5">
                    <div className="flex items-center gap-3 mb-3">
                      <div className="bg-blue-100 p-2 rounded-full text-blue-600">
                        <ExternalLinkIcon className="w-5 h-5" />
                      </div>
